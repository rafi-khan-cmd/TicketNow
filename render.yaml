services:
  - type: web
    name: ticketnow-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGING_THRESHOLD_HOURS
        value: 48
      - key: DATABASE_URL
        fromDatabase:
          name: ticketnow-db
          property: connectionString
      - key: CLIENT_URL
        value: https://ticketnow-web.onrender.com

  - type: web
    name: ticketnow-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ticketnow-api.onrender.com/api

databases:
  - name: ticketnow-db
    plan: free
